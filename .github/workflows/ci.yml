name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: gateway
      - run: npm test
        working-directory: gateway
      - run: node --check dsh-link/index.js

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for iPhone Simulator
        run: >-
          xcodebuild -project ios/HarnessPocket.xcodeproj -scheme HarnessPocket
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/HarnessPocket"
          CODE_SIGNING_ALLOWED=NO build
